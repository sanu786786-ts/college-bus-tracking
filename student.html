<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusBus — Student</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="app">
  <aside class="side">
    <div class="field"><input id="search" placeholder="🔍 Search route or stop... (e.g. Katraj)">
    </div>
    <div id="routes"></div>
    <div id="detail"></div>
  </aside>
  <div id="map"></div>
</div>

<dialog id="dlg">
  <h2 style="margin-bottom:4px">Suggest a change</h2>
  <p class="muted" style="margin:0 0 14px">Changes are published only after admin review.</p>
  <div class="field"><label>Route</label><select id="qRoute"></select></div>
  <div class="field"><label>Your suggestion</label><textarea id="qText" rows="4" placeholder="e.g. Please add a stop at Sarasbaug, or move the 8:30 bus to 8:15"></textarea></div>
  <div class="row" style="justify-content:flex-end"><button class="btn sec" id="qCancel">Cancel</button><button class="btn" id="qSend">Send</button></div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script><script src="js/seed.js"></script><script src="js/util.js"></script>
<script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/eta.js"></script>
<script src="js/student.js"></script>
</body></html>
